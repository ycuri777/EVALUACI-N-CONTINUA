<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ejercicio 4 - Calculadora</title><link rel="stylesheet" href="estilos.css"></head><body><header><h1>Ejercicio 4: Calculadora</h1><p>Práctica HTML5 y JavaScript</p></header><main><p><a href="index.html">← Volver al menú</a></p><section class="panel"><p>Realiza las cuatro operaciones básicas.</p><label>Primer número</label><input id="a" type="number" step="any"><label>Operador</label><select id="op"><option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option></select><label>Segundo número</label><input id="b" type="number" step="any"><div><button type="button" onclick="resolver()">Calcular / Verificar</button></div><p id="resultado" class="resultado" aria-live="polite">Aquí aparecerá el resultado.</p></section></main><script>function numero(id){const e=document.getElementById(id);return e.value.trim()===''?null:Number(e.value)}function mostrar(m){document.getElementById('resultado').textContent=m}
function resolver(){const a=numero('a'),b=numero('b'),op=document.getElementById('op').value;if(a===null||b===null)return mostrar('Ingresa ambos números.');if(op==='/'&&b===0)return mostrar('No se puede dividir entre cero.');let r;switch(op){case '+':r=a+b;break;case '-':r=a-b;break;case '*':r=a*b;break;case '/':r=a/b;break;}mostrar('Resultado: '+r);}</script></body></html>
