<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ejercicio 2 - Calificación</title><link rel="stylesheet" href="estilos.css"></head><body><header><h1>Ejercicio 2: Calificación</h1><p>Práctica HTML5 y JavaScript</p></header><main><p><a href="index.html">← Volver al menú</a></p><section class="panel"><p>Clasifica una nota entre 0 y 20.</p><label>Calificación</label><input id="nota" type="number" min="0" max="20"><div><button type="button" onclick="resolver()">Calcular / Verificar</button></div><p id="resultado" class="resultado" aria-live="polite">Aquí aparecerá el resultado.</p></section></main><script>function numero(id){const e=document.getElementById(id);return e.value.trim()===''?null:Number(e.value)}function mostrar(m){document.getElementById('resultado').textContent=m}
function resolver(){const n=numero('nota');if(n===null||n<0||n>20)return mostrar('La nota debe estar entre 0 y 20.');mostrar(n<10?'Muy bajo':n<=13?'Regular':n<=17?'Bueno':'Excelente');}</script></body></html>
