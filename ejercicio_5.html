<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ejercicio 5 - Año bisiesto</title><link rel="stylesheet" href="estilos.css"></head><body><header><h1>Ejercicio 5: Año bisiesto</h1><p>Práctica HTML5 y JavaScript</p></header><main><p><a href="index.html">← Volver al menú</a></p><section class="panel"><p>Verifica si el año es divisible por 4 y no por 100, o por 400.</p><label>Año</label><input id="anio" type="number" step="1" min="1"><div><button type="button" onclick="resolver()">Calcular / Verificar</button></div><p id="resultado" class="resultado" aria-live="polite">Aquí aparecerá el resultado.</p></section></main><script>function numero(id){const e=document.getElementById(id);return e.value.trim()===''?null:Number(e.value)}function mostrar(m){document.getElementById('resultado').textContent=m}
function resolver(){const n=numero('anio');if(n===null||!Number.isInteger(n)||n<1)return mostrar('Ingresa un año entero positivo.');mostrar((n%4===0&&n%100!==0)||n%400===0?'Es un año bisiesto.':'No es un año bisiesto.');}</script></body></html>
