<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ejercicio 6 - Inicio de sesión</title><link rel="stylesheet" href="estilos.css"></head><body><header><h1>Ejercicio 6: Inicio de sesión</h1><p>Práctica HTML5 y JavaScript</p></header><main><p><a href="index.html">← Volver al menú</a></p><section class="panel"><p>Simulación educativa con credenciales de prueba (no usar contraseñas reales).</p><table><tr><td>Usuario</td><td><input id="usuario" autocomplete="off"></td></tr><tr><td>Contraseña</td><td><input id="clave" type="password"></td></tr></table><small>Prueba: usuario <b>admin</b> y contraseña <b>1234</b>.</small><div><button type="button" onclick="resolver()">Calcular / Verificar</button></div><p id="resultado" class="resultado" aria-live="polite">Aquí aparecerá el resultado.</p></section></main><script>function numero(id){const e=document.getElementById(id);return e.value.trim()===''?null:Number(e.value)}function mostrar(m){document.getElementById('resultado').textContent=m}
function resolver(){const u=document.getElementById('usuario').value.trim(),c=document.getElementById('clave').value;mostrar(u==='admin'&&c==='1234'?'Inicio de sesión correcto.':u!=='admin'?'Nombre de usuario incorrecto.':'Contraseña incorrecta.');}</script></body></html>
