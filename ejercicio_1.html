<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ejercicio 1 - Adolescencia</title><link rel="stylesheet" href="estilos.css"></head><body><header><h1>Ejercicio 1: Adolescencia</h1><p>Práctica HTML5 y JavaScript</p></header><main><p><a href="index.html">← Volver al menú</a></p><section class="panel"><p>Determina si la edad está entre 13 y 17 años inclusive.</p><label>Edad</label><input id="edad" type="number" min="0" step="1"><div><button type="button" onclick="resolver()">Calcular / Verificar</button></div><p id="resultado" class="resultado" aria-live="polite">Aquí aparecerá el resultado.</p></section></main><script>function numero(id){const e=document.getElementById(id);return e.value.trim()===''?null:Number(e.value)}function mostrar(m){document.getElementById('resultado').textContent=m}
function resolver(){const n=numero('edad');if(n===null||!Number.isInteger(n)||n<0)return mostrar('Ingresa una edad válida.');mostrar(n>=13&&n<=17?'La persona es adolescente.':'La persona no es adolescente.');}</script></body></html>
