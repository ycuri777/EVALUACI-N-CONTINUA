<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ejercicio 9 - Tipo de clima</title><link rel="stylesheet" href="estilos.css"></head><body><header><h1>Ejercicio 9: Tipo de clima</h1><p>Práctica HTML5 y JavaScript</p></header><main><p><a href="index.html">← Volver al menú</a></p><section class="panel"><p>Clasifica la temperatura según la tabla de la práctica.</p><label>Temperatura (°C)</label><input id="temp" type="number" step="any"><table><tr><th>Temperatura</th><th>Clima</th></tr><tr><td>≤ 10</td><td>Frío</td></tr><tr><td>10 &lt; TP ≤ 20</td><td>Nublado</td></tr><tr><td>20 &lt; TP ≤ 30</td><td>Caluroso</td></tr><tr><td>&gt; 30</td><td>Tropical</td></tr></table><div><button type="button" onclick="resolver()">Calcular / Verificar</button></div><p id="resultado" class="resultado" aria-live="polite">Aquí aparecerá el resultado.</p></section></main><script>function numero(id){const e=document.getElementById(id);return e.value.trim()===''?null:Number(e.value)}function mostrar(m){document.getElementById('resultado').textContent=m}
function resolver(){const n=numero('temp');if(n===null)return mostrar('Ingresa una temperatura válida.');mostrar('Tipo de clima: '+(n<=10?'Frío':n<=20?'Nublado':n<=30?'Caluroso':'Tropical'));}</script></body></html>
