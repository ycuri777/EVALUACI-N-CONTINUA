<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ejercicio 8 - Tres dados</title><link rel="stylesheet" href="estilos.css"></head><body><header><h1>Ejercicio 8: Tres dados</h1><p>Práctica HTML5 y JavaScript</p></header><main><p><a href="index.html">← Volver al menú</a></p><section class="panel"><p>Cuenta cuántos dados muestran el número seis.</p><label>Dado 1</label><input id="d1" type="number" min="1" max="6" step="1"><label>Dado 2</label><input id="d2" type="number" min="1" max="6" step="1"><label>Dado 3</label><input id="d3" type="number" min="1" max="6" step="1"><div><button type="button" onclick="resolver()">Calcular / Verificar</button></div><p id="resultado" class="resultado" aria-live="polite">Aquí aparecerá el resultado.</p></section></main><script>function numero(id){const e=document.getElementById(id);return e.value.trim()===''?null:Number(e.value)}function mostrar(m){document.getElementById('resultado').textContent=m}
function resolver(){const d=['d1','d2','d3'].map(numero);if(d.some(n=>n===null||!Number.isInteger(n)||n<1||n>6))return mostrar('Cada dado debe tener un valor entero entre 1 y 6.');const s=d.filter(n=>n===6).length;mostrar('Cantidad de seis: '+s+' | '+(['Pésimo','Regular','Muy bien','Excelente'][s]));}</script></body></html>
