<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ejercicio 7 - Farmacia</title><link rel="stylesheet" href="estilos.css"></head><body><header><h1>Ejercicio 7: Farmacia</h1><p>Práctica HTML5 y JavaScript</p></header><main><p><a href="index.html">← Volver al menú</a></p><section class="panel"><p>Contado: descuento del 5 %. Tarjeta: recargo del 3 %.</p><label>Valor de compra (S/)</label><input id="compra" type="number" min="0" step="0.01"><label>Forma de pago</label><select id="pago"><option value="contado">Contado</option><option value="tarjeta">Tarjeta</option></select><div><button type="button" onclick="resolver()">Calcular / Verificar</button></div><p id="resultado" class="resultado" aria-live="polite">Aquí aparecerá el resultado.</p></section></main><script>function numero(id){const e=document.getElementById(id);return e.value.trim()===''?null:Number(e.value)}function mostrar(m){document.getElementById('resultado').textContent=m}
function resolver(){const n=numero('compra'),p=document.getElementById('pago').value;if(n===null||n<0)return mostrar('Ingresa un importe válido.');const cambio=n*(p==='contado'?.05:.03),total=p==='contado'?n-cambio:n+cambio;mostrar((p==='contado'?'Descuento (5 %): S/ ':'Recargo (3 %): S/ ')+cambio.toFixed(2)+' | Total a pagar: S/ '+total.toFixed(2));}</script></body></html>
