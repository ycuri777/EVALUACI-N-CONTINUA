<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ejercicio 3 - Mes del año</title><link rel="stylesheet" href="estilos.css"></head><body><header><h1>Ejercicio 3: Mes del año</h1><p>Práctica HTML5 y JavaScript</p></header><main><p><a href="index.html">← Volver al menú</a></p><section class="panel"><p>Usa switch para identificar el mes.</p><label>Número del mes</label><input id="mes" type="number" min="1" max="12" step="1"><div><button type="button" onclick="resolver()">Calcular / Verificar</button></div><p id="resultado" class="resultado" aria-live="polite">Aquí aparecerá el resultado.</p></section></main><script>function numero(id){const e=document.getElementById(id);return e.value.trim()===''?null:Number(e.value)}function mostrar(m){document.getElementById('resultado').textContent=m}
function resolver(){const n=numero('mes');let mes;switch(n){case 1:mes='Enero';break;case 2:mes='Febrero';break;case 3:mes='Marzo';break;case 4:mes='Abril';break;case 5:mes='Mayo';break;case 6:mes='Junio';break;case 7:mes='Julio';break;case 8:mes='Agosto';break;case 9:mes='Septiembre';break;case 10:mes='Octubre';break;case 11:mes='Noviembre';break;case 12:mes='Diciembre';break;default:mes='Ingresa un número entero del 1 al 12.';}mostrar(mes);}</script></body></html>
